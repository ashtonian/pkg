# pnpm settings for the TypeScript SDK. pnpm reads its settings from this file only,
# never from package.json; the SDK is a single package, so it lists no packages.

# package.json's packageManager field pins pnpm, and CI installs that version from it.
# Left at its default, pmOnFail also records the pinned pnpm as a leading document in
# pnpm-lock.yaml. GitHub's dependency graph ignores a two-document lockfile, so the SDK's
# dependencies would drop out of the graph, its SBOM and any Dependabot alerts. A
# different local pnpm therefore runs as itself rather than switching to the pinned one.
pmOnFail: ignore
