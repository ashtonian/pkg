name: Artifact storage
on:
  push:
    branches: [main]
    paths: ['.github/**', 'scripts/ci-acceptance.py', 'tools/ci_acceptance.py', 'tools/testinventory/**']
  pull_request:
    paths: ['.github/**', 'scripts/ci-acceptance.py', 'tools/ci_acceptance.py', 'tools/testinventory/**']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
defaults:
  run:
    shell: bash
concurrency:
  group: artifact-storage-${{ github.ref }}
  # A newer push to a pull request replaces its run; main's runs all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contract:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ashtonian/go-ci-actions/.github/workflows/artifact-consumer.yml@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
    with:
      runner: arc-pkg
    secrets:
      CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
