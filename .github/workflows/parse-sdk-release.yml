name: publish Parse SDK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Parse release tag (parse/vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish the verified package (false retains an artifact only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: parse-sdk-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: github.actor_id == '4212452' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'parse/v'))
    # npm's trusted publisher supports GitHub-hosted runners only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      PARSE_SDK_DIR: ${{ github.workspace }}/source/parse/sdk/ts
    steps:
      - name: Validate release selection
        run: |
          [[ "$RELEASE_TAG" =~ ^parse/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then error("a published stable release is required") else . end'
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Check out the immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: source/parse/sdk/ts/package-lock.json
      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.2.2
      - name: Check release identity
        run: |
          git -C source merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync(`${process.env.PARSE_SDK_DIR}/package.json`, 'utf8'));
          const lock = JSON.parse(fs.readFileSync(`${process.env.PARSE_SDK_DIR}/package-lock.json`, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('source/.release-please-manifest.json', 'utf8'));
          assert.equal(pkg.name, '@ashtonian/parse');
          assert.equal(`parse/v${pkg.version}`, process.env.RELEASE_TAG);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert.equal(manifest.parse, pkg.version);
          JS
      - name: Build, pack and verify the released SDK
        run: |
          make -C source test-parse-sdk
          mkdir artifacts
          (cd "$PARSE_SDK_DIR" && npm pack --json --pack-destination "$GITHUB_WORKSPACE/artifacts") > artifacts/pack.json
          version=${RELEASE_TAG#parse/v}
          bash tooling/tools/check-parse-sdk-release.sh "artifacts/ashtonian-parse-$version.tgz"
          git -C source rev-parse HEAD > artifacts/source-commit.txt
      - name: Retain the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parse-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
      - name: Check whether this exact package is already published
        id: registry
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const [packed] = JSON.parse(fs.readFileSync('artifacts/pack.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/@ashtonian%2fparse/${packed.version}`, { signal: AbortSignal.timeout(30_000) });
          if (response.status === 404) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          } else {
            assert.ok(response.ok, `registry returned ${response.status}`);
            const published = await response.json();
            assert.equal(published.dist.integrity, packed.integrity, 'published version has different bytes');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
          }
          JS
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.publish == 'true' && (github.event_name == 'release' || inputs.publish)
        run: npm publish "artifacts/ashtonian-parse-${RELEASE_TAG#parse/v}.tgz" --access public --provenance --registry=https://registry.npmjs.org
      - name: Verify a fresh public-registry consumer
        if: steps.registry.outputs.publish == 'false' || github.event_name == 'release' || inputs.publish
        run: bash tooling/tools/check-parse-sdk-release.sh --registry "${RELEASE_TAG#parse/v}"
