name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Parse release tag (parse/vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish the verified package (false retains an artifact only)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

env:
  CI_ARTIFACT_ENDPOINT: ${{ vars.CI_ARTIFACT_ENDPOINT }}

jobs:
  release-please:
    if: github.actor_id == '4212452' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      parse_tag: ${{ steps.release.outputs['parse--tag_name'] }}
    runs-on: arc-pkg
    steps:
      # A release PR opened with GITHUB_TOKEN does not trigger CI; set the
      # RELEASE_PLEASE_TOKEN secret (a fine-grained token with contents and
      # pull-request write) for checks to run on it.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ !cancelled() && github.actor_id == '4212452' && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.parse_tag != '') }}
    concurrency:
      group: parse-sdk-${{ inputs.tag || needs.release-please.outputs.parse_tag }}
      cancel-in-progress: false
    # npm's trusted publisher supports GitHub-hosted runners only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.parse_tag }}
      GH_TOKEN: ${{ github.token }}
      PARSE_SDK_DIR: ${{ github.workspace }}/source/parse/sdk/ts
    steps:
      - name: Validate release selection
        run: |
          [[ "$RELEASE_TAG" =~ ^parse/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then error("a published stable release is required") else . end'
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          persist-credentials: false
      - name: Check out the immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      # The release's own packageManager field selects pnpm, which also exchanges the
      # job's OIDC token for npm trusted publishing.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: source/parse/sdk/ts/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: source/parse/sdk/ts/pnpm-lock.yaml
      - name: Check release identity
        run: |
          git -C source merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync(`${process.env.PARSE_SDK_DIR}/package.json`, 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('source/.release-please-manifest.json', 'utf8'));
          assert.equal(pkg.name, '@ashtonian/parse');
          assert.equal(`parse/v${pkg.version}`, process.env.RELEASE_TAG);
          assert.equal(manifest.parse, pkg.version);
          JS
      - name: Build, pack and verify the released SDK
        run: |
          make -C source test-parse-sdk
          mkdir artifacts
          pnpm --dir "$PARSE_SDK_DIR" pack --json --pack-destination "$GITHUB_WORKSPACE/artifacts" > artifacts/pack.json
          version=${RELEASE_TAG#parse/v}
          bash tooling/tools/check-parse-sdk-release.sh "artifacts/ashtonian-parse-$version.tgz"
          git -C source rev-parse HEAD > artifacts/source-commit.txt
      - name: Retain the verified package
        uses: ashtonian/go-ci-actions/upload-artifact@fd722a57af04549dc44eeb876c53c72da97d7faf # v1.5.0
        with:
          name: parse-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
      - name: Check whether this exact package is already published
        id: registry
        run: |
          node tooling/tools/check-parse-sdk-registry.mjs artifacts/pack.json >> "$GITHUB_OUTPUT"
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.publish == 'true' && (github.event_name == 'push' || inputs.publish)
        run: |
          # npm provenance records GITHUB_SHA, not an alternate checkout's HEAD.
          if [[ $(git -C source rev-parse HEAD) != "$GITHUB_SHA" ]]; then
            echo '::error::Dispatch publication at the release tag so provenance identifies the package source.'
            exit 1
          fi
          pnpm publish "$GITHUB_WORKSPACE/artifacts/ashtonian-parse-${RELEASE_TAG#parse/v}.tgz" --access public --provenance --registry=https://registry.npmjs.org/
      - name: Wait for the exact package to become installable
        if: steps.registry.outputs.publish == 'false' || github.event_name == 'push' || inputs.publish
        timeout-minutes: 16
        run: node tooling/tools/check-parse-sdk-registry.mjs artifacts/pack.json --wait
      - name: Verify a fresh public-registry consumer
        if: steps.registry.outputs.publish == 'false' || github.event_name == 'push' || inputs.publish
        run: bash tooling/tools/check-parse-sdk-release.sh --registry "${RELEASE_TAG#parse/v}"
