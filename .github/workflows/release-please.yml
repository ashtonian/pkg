name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A release PR opened with GITHUB_TOKEN does not trigger CI; set the
      # RELEASE_PLEASE_TOKEN secret (a fine-grained token with contents and
      # pull-request write) for checks to run on it.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
