name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ['1.27.0', '1.27.x']
        include:
          # The file watch rests on kqueue there, inotify on Linux.
          - os: macos-latest
            go: '1.27.x'
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'arc-pkg' || matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ashtonian/go-ci-actions@853832a13eec9e84695a009516a948fca3ce0e9d # v1.0.0
        with:
          workload: ${{ toJSON(matrix) }}
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: Gowalker tests
        run: make test-gowalker
      - name: Config tests
        run: make test-config
      - name: HTTPx unit tests with race detection
        run: make test-httpx-unit
      - name: HTTPx integration tests with race detection
        run: make test-httpx-integration
  httpx-minimum:
    name: httpx (go 1.26)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-pkg
    steps:
      - uses: actions/checkout@v7
      - uses: ashtonian/go-ci-actions@853832a13eec9e84695a009516a948fca3ce0e9d # v1.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: "**/go.sum"
      - name: Test HTTPx at its minimum Go version
        env:
          GOTOOLCHAIN: local
        run: |
          workspace=$(mktemp -d)
          trap 'rm -rf "$workspace"' EXIT
          (cd "$workspace" && GOWORK=off go work init \
            "$GITHUB_WORKSPACE/httpx" "$GITHUB_WORKSPACE/httpx/codec/msgpack" \
            "$GITHUB_WORKSPACE/httpx/codec/proto" "$GITHUB_WORKSPACE/httpx/compress/brotli")
          GOWORK="$workspace/go.work" make test-httpx-unit test-httpx-integration
  modules:
    name: module archives, examples and release tooling
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-pkg
    steps:
      - uses: actions/checkout@v7
      - uses: ashtonian/go-ci-actions@853832a13eec9e84695a009516a948fca3ce0e9d # v1.0.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - run: make release-check
      - run: make cookbook-check
      - run: make tool-check
  lint:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-pkg
    steps:
      - uses: actions/checkout@v7
      - uses: ashtonian/go-ci-actions@853832a13eec9e84695a009516a948fca3ce0e9d # v1.0.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - run: make lint
