name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The repository's Actions policy runs workflows for the owner only, so a
  # pull request a bot opens (Dependabot's, or a release PR opened with
  # GITHUB_TOKEN) gets no checks. Run them on its branch with
  # `gh workflow run ci.yml --ref <branch>`; they report on the head
  # commit, so the pull request shows them.
  workflow_dispatch:
  # nightly.yml: every suite at full scope, every unit test rerun rather than
  # replayed from the test cache, every parse unit test under the race
  # detector, and the benchmarks; nothing when main has not moved since the
  # last green nightly (scope decides).
  workflow_call:
    inputs:
      nightly:
        description: Rerun every unit test, every parse unit test under the race detector.
        type: boolean
        default: false
    secrets:
      CI_ARTIFACT_ENDPOINT:
        required: true
      PRIVATE_REFERENCE_PATTERNS:
        required: true

permissions:
  id-token: write
  contents: read
  actions: read

# A newer run of the same PR cancels the older one. Runs on main all finish:
# a push is measured from the last green run and reuses its pull request's
# jobs only over that commit, so a cancelled push would hold the next one's
# base back. A push waiting behind another is replaced by the next, which
# covers both. Dispatched runs complete.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
  # The Makefile's unit targets replay a passing result from the build cache
  # while the test binary and what its tests read are unchanged; setup stamps
  # tracked files with content-derived mtimes so checkouts share results. The
  # nightly reruns every one. go clean -testcache would not: it expires results
  # by the time the cache reports for each, and the runners' remote cache
  # reports when it copied the result into the job.
  UNIT_TEST_COUNT: ${{ inputs.nightly && '-count=1' || '' }}

jobs:
  scope:
    name: CI change scope
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-pkg
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      # A merge push runs only the jobs its pull request's run did not pass for this merge.
      jobs: ${{ steps.accepted.outputs.remaining || steps.checks.outputs.jobs }}
      # Before reuse: main's benchmark artifacts come from pushes, never from a PR.
      selected: ${{ steps.checks.outputs.jobs }}
      wide-jobs: ${{ steps.scope.outputs.wide-jobs }}
      go-args: ${{ steps.scope.outputs.go-args }}
      checks: ${{ steps.checks.outputs.checks }}
      lint-cookbook: ${{ steps.checks.outputs.lint-cookbook }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every runs-on label must be one a runner of this repository carries,
      # or the job waits until it is cancelled; macos-latest is GitHub's.
      - uses: ashtonian/go-ci-actions/runner-labels@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
      # Go for scope's package graph; nothing is built.
      - uses: ashtonian/go-ci-actions@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          go-version: '1.27.x'
          cache-mode: off
      - name: Verify CI scope policy
        run: python3 -B -m unittest discover -s tools -p 'test_ci_*.py'
      # The patterns name private code, so they live in a secret, not here;
      # the check prints only path:line.
      - name: Refuse private references
        env:
          PRIVATE_REFERENCE_PATTERNS: ${{ secrets.PRIVATE_REFERENCE_PATTERNS }}
        run: python3 -B tools/private_references.py
      # A job runs when one of its paths changed or the change reaches one of its
      # packages. go-ignore lists what no workspace Go code reads; go-owners, the
      # files tests read outside their package. tools/test_ci_release_checks.py
      # keeps both, and the module lists, in step with the Makefile and tests.
      - id: scope
        uses: ashtonian/go-ci-actions/scope@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          workflow: ci.yml
          jobs: |
            {
              "test": {"go": ["./..."]},
              "test-darwin": {"go": ["./process/...", "./state/...", "./onepassword/...", "./config/...", "./config/kongprovider/..."]},
              "parse-postgres": {"go": ["./parse/...", "./parse/parsepgx/...", "./parse/parsesql/..."]},
              "cookbook-postgres": {"paths": ["config/examples/cookbook/go.mod", "config/examples/cookbook/go.sum", "config/examples/cookbook/internal/pgtest/**", "config/examples/cookbook/settingsstore/**"], "go": ["./config"]},
              "parse-sdk": ["parse/sdk/**", "parse/testdata/**", "parse/examples/server/README.md", "tools/check-parse-sdk-*", "tools/check-pnpm.mjs"],
              "parse-benchmarks": {"paths": ["tools/bench-parse.sh"], "go": ["./parse", "./parse/core", "./parse/filter", "./parse/internal/jsonkeys", "./parse/parsehttp"]},
              "minimum-go": {"go": ["./httpx/...", "./httpx/oauth2/...", "./httpx/codec/msgpack/...", "./httpx/codec/proto/...", "./httpx/compress/brotli/...", "./gitx/..."]},
              "modules": ["**"],
              "lint": {"paths": [".golangci.yml", "tools/gorules/**"], "go": ["./..."]}
            }
          shared: |
            .github/**
            Makefile
            tools/ci_release_checks.py
            tools/fuzz_corpus.py
            tools/make_dry_run.py
            tools/private_references.py
            tools/test_ci_*.py
          # Every platform and -tags set CI compiles: a file joins a package only under some.
          go-builds: |
            GOOS=linux GOARCH=amd64
            GOOS=darwin GOARCH=arm64
          go-tags: |
            -
            unit
            integration
            concurrency
            unit,integration
          go-ignore: |
            CONTRIBUTING.md
            README.md
            **/CHANGELOG.md
            config/docs/**/*.md
            gowalker/docs/**/*.md
            httpx/docs/**/*.md
            parse/sdk/**
            .release-please-manifest.json
            release-please-config.json
            tools/check-*
            tools/bench-parse.sh
            tools/postgres-up.sh
            tools/release-please/**
            tools/modarchive/**
            tools/doccheck/**
            .golangci.yml
            tools/gorules/**
            config/examples/cookbook/**
            httpx/examples/gin/**
            httpx/internal/bench/**
            parse/examples/server/**
          go-owners: |
            {
              "config/examples/quickstart/main.go": ["./config"],
              "config/kongprovider/examples/**": ["./config/kongprovider"],
              "httpx/examples/quickstart/main.go": ["./httpx"],
              "gitx/README.md": ["./gitx/cmd/mergeinserts"],
              "parse/testdata/filter_conformance.json": ["./parse/filter", "./parse/client"],
              "parse/testdata/patch_conformance.json": ["./parse/client"],
              "parse/testdata/sdk_wire.json": ["./parse/client", "./parse/parsepgx", "./parse/parsesql"],
              "parse/testdata/error_codes.json": ["./parse/client"],
              "parse/testdata/schema_document.json": ["./parse/client"],
              "parse/testdata/client_requests.json": ["./parse/client", "./parse/parsepgx", "./parse/parsesql"],
              "parse/core/code.go": ["./parse/client"],
              "parse/docs/*.md": ["./parse"],
              "parse/parsepgx/*_test.go": ["./parse"],
              "parse/parsesql/*_test.go": ["./parse"]
            }
      # Release checks follow the module trees a change touches; that map is
      # pkg's. On a merge push it also measures the merge from its first
      # parent, as the pull request's run did, for acceptance to compare.
      - id: checks
        env:
          SCOPE_JOBS: ${{ steps.scope.outputs.jobs }}
          SCOPE_FULL: ${{ steps.scope.outputs.full }}
          SCOPE_FILES: ${{ steps.scope.outputs.files }}
          SCOPE_SELECTIONS: ${{ steps.scope.outputs.selections }}
          SCOPE_PARENT_SELECTIONS: ${{ steps.scope.outputs.parent-selections }}
          SCOPE_PARENT_FILES: ${{ steps.scope.outputs.parent-files }}
        run: python3 -B tools/ci_release_checks.py
      # A job is reused only when the pull request's run checked this merge,
      # GitHub shows the job passed there, and its selection covers this one.
      - id: accepted
        if: github.event_name == 'push'
        uses: ashtonian/go-ci-actions/acceptance@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          mode: verify
          base: ${{ steps.scope.outputs.base }}
          required: ${{ steps.checks.outputs.required }}
          selections: ${{ steps.checks.outputs.selections }}
          parent-selections: ${{ steps.checks.outputs.parent-selections }}
          variables: ${{ toJSON(vars) }}

  test:
    needs: scope
    name: test (ubuntu-latest)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && contains(needs.scope.outputs.jobs, '"test"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    env:
      # The import paths the change reaches, or every package when the job is
      # wide; each target tests its modules' share.
      PACKAGES: ${{ contains(needs.scope.outputs.wide-jobs, '"test"') && 'all' || needs.scope.outputs.go-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: "**/go.sum"
      - name: Native process and document unit tests
        run: make test-native-unit
      - name: Native process and document integration tests
        run: make test-native-integration
      - name: Config tests
        run: make test-config
      - name: gitx tests
        run: make test-gitx
      - name: JSON value tests
        run: make test-jsonvalue
      - name: Gowalker tests
        run: make test-gowalker
      - name: HTTPx unit tests with race detection
        run: make test-httpx-unit
      - name: HTTPx integration tests with race detection
        run: make test-httpx-integration
      # Parse's SQLite integration runs in parse-postgres, beside PostgreSQL.
      # Pull requests race only the parse tests that run code concurrently;
      # the nightly run races every one.
      - name: Parse unit tests and fuzz seeds
        if: ${{ !inputs.nightly }}
        run: make test-parse-unit
      - name: Parse concurrency tests with race detection
        if: ${{ !inputs.nightly }}
        run: make test-parse-race
      - name: Parse unit tests and fuzz seeds with race detection
        if: ${{ inputs.nightly }}
        run: make test-parse-race-all
      - name: Parse client tests with race detection
        run: make test-parse-client
  # Only the modules with platform code: config's file watch rests on kqueue
  # there, and the native modules' processes and files on Darwin. Lint vets
  # every module on the declared Go floor. The repository variable
  # MACOS_CI=off leaves it out while GitHub-hosted minutes are unavailable;
  # `make test-native-unit test-native-integration test-config` on a Mac
  # covers it then.
  test-darwin:
    needs: scope
    name: test (macos-latest)
    if: vars.MACOS_CI != 'off' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && contains(needs.scope.outputs.jobs, '"test-darwin"')
    permissions:
      contents: read
      id-token: write
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PACKAGES: ${{ contains(needs.scope.outputs.wide-jobs, '"test-darwin"') && 'all' || needs.scope.outputs.go-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: "**/go.sum"
      - name: Native process and document unit tests
        run: make test-native-unit
      - name: Native process and document integration tests
        run: make test-native-integration
      - name: Config tests
        run: make test-config
  parse-postgres:
    needs: scope
    name: parse integration (SQLite, PostgreSQL ${{ matrix.postgres }})
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && contains(needs.scope.outputs.jobs, '"parse-postgres"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    env:
      PACKAGES: ${{ contains(needs.scope.outputs.wide-jobs, '"parse-postgres"') && 'all' || needs.scope.outputs.go-args }}
    services:
      postgres:
        image: postgis/postgis:${{ matrix.postgres }}-3.6
        env:
          POSTGRES_USER: parse
          POSTGRES_PASSWORD: parse
          POSTGRES_DB: parse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U parse -d parse"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: Parse SQLite and PostgreSQL integration with race detection
        env:
          PARSE_POSTGRES_DSN: postgres://parse:parse@localhost:5432/parse?sslmode=disable
          PARSE_POSTGIS_DSN: postgres://parse:parse@localhost:5432/parse?sslmode=disable
          # A missing DSN fails the fixture's tests here instead of skipping them.
          PARSE_REQUIRE_PG: '1'
        run: make test-parse-integration
  # The settings-store recipe documents PostgreSQL's behaviour (the lock row
  # under READ COMMITTED, ON CONFLICT, the octet_length size query); this runs
  # its database tests on SQLite and PostgreSQL. It runs when the recipe, its
  # fixture or the cookbook's dependencies change, or a change reaches config.
  cookbook-postgres:
    needs: scope
    name: cookbook integration (SQLite, PostgreSQL 19)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && contains(needs.scope.outputs.jobs, '"cookbook-postgres"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: cookbook
          POSTGRES_PASSWORD: cookbook
          POSTGRES_DB: cookbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cookbook -d cookbook"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: Cookbook SQLite and PostgreSQL integration with race detection
        env:
          COOKBOOK_POSTGRES_DSN: postgres://cookbook:cookbook@localhost:5432/cookbook?sslmode=disable
          # A missing DSN fails the PostgreSQL legs here instead of skipping them.
          COOKBOOK_REQUIRE_PG: '1'
        run: make cookbook-integration
  parse-sdk:
    needs: scope
    name: parse TypeScript SDK and corpora (node 22.13.0 and lts/*)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && contains(needs.scope.outputs.jobs, '"parse-sdk"')
    runs-on: arc-pkg
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before pnpm: points pnpm at the runner's in-cluster npm cache when it answers,
      # and leaves npmjs otherwise.
      - uses: ashtonian/go-ci-actions/npm-registry@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
      # pnpm next: setup-node's pnpm cache asks pnpm for its store path. The version
      # comes from the SDK's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: parse/sdk/ts/package.json
      # package.json's engines floor, exactly: every check runs here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: parse/sdk/ts/pnpm-lock.yaml
      - name: Check the engines floor is the Node.js under test
        working-directory: parse/sdk/ts
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const floor = JSON.parse(fs.readFileSync('package.json', 'utf8')).engines.node;
          if (floor !== `>=${process.versions.node}`) {
            console.error(`::error::package.json engines.node is ${floor}; this leg runs Node.js ${process.versions.node}. Keep the two equal.`);
            process.exit(1);
          }
          JS
      - run: make test-parse-sdk
      - name: Registry availability checks
        run: make parse-sdk-registry-check
      - name: Packed SDK consumer
        run: make parse-sdk-release-check
      # The newest LTS repeats only what the runtime decides, on the same build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Corpora and runtime tests on the newest LTS
        working-directory: parse/sdk/ts
        run: pnpm test
      - name: Packed SDK consumer on the newest LTS
        run: make parse-sdk-release-check
  parse-benchmarks:
    needs: scope
    name: parse benchmark artifacts
    # On main, only when the change reaches a benchmarked package; the
    # nightly run always records them.
    if: github.actor_id == '4212452' && github.event_name != 'pull_request' && contains(needs.scope.outputs.selected, '"parse-benchmarks"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: Record every parse package's benchmarks and profiles
        run: tools/bench-parse.sh parse-benchmarks
      - uses: ashtonian/go-ci-actions/upload-artifact@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          name: parse-benchmarks-${{ github.sha }}
          path: parse-benchmarks
  minimum-go:
    needs: scope
    name: httpx and gitx (go 1.26)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && contains(needs.scope.outputs.jobs, '"minimum-go"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: "**/go.sum"
      - name: Test HTTPx at its minimum Go version
        env:
          GOTOOLCHAIN: local
        run: |
          workspace=$(mktemp -d)
          trap 'rm -rf "$workspace"' EXIT
          (cd "$workspace" && GOWORK=off go work init \
            "$GITHUB_WORKSPACE/httpx" "$GITHUB_WORKSPACE/httpx/oauth2" \
            "$GITHUB_WORKSPACE/httpx/codec/msgpack" \
            "$GITHUB_WORKSPACE/httpx/codec/proto" "$GITHUB_WORKSPACE/httpx/compress/brotli")
          GOWORK="$workspace/go.work" make test-httpx-unit test-httpx-integration
      - name: Test gitx at its minimum Go version
        # The workspace's go line is newer than gitx's floor, so the module is tested on its own.
        env:
          GOTOOLCHAIN: local
          GOWORK: off
        working-directory: gitx
        run: |
          go version | grep -F ' go1.26.'
          go vet ./...
          go test -race -count=1 ./...
  modules:
    needs: scope
    name: module archives, examples and release tooling
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && contains(needs.scope.outputs.jobs, '"modules"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      # The release-please runner's check needs Node.js and pnpm.
      - if: contains(needs.scope.outputs.checks, 'release-please-check')
        uses: ./.github/actions/release-please-tool
      - name: Release, cookbook and release-tool checks for the changed modules
        env:
          CHECKS: ${{ needs.scope.outputs.checks }}
          # A summary per go command: the fresh consumers' dependency compiles
          # should be remote hits (the scripts build with -trimpath).
          GOCACHEPROG_LOG_LEVEL: info
        run: |
          read -ra checks <<< "$CHECKS"
          make "${checks[@]}"
  lint:
    needs: scope
    name: lint (go 1.27.0 floor)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && contains(needs.scope.outputs.jobs, '"lint"')
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    env:
      PACKAGES: ${{ contains(needs.scope.outputs.wide-jobs, '"lint"') && 'all' || needs.scope.outputs.go-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # golangci-lint reports the issues new since the merge base with
          # origin/main (.golangci.yml), which needs main's history.
          fetch-depth: 0
      - uses: ashtonian/go-ci-actions@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          go-version: '1.27.0'
          cache-dependency-path: "**/go.sum"
          test-input-mtimes: off
      # Vet type-checks every package and test, so on the declared floor it is
      # also the floor's build check.
      - name: go vet on the declared Go floor, staticcheck and golangci-lint on Go 1.27.4
        env:
          GOTOOLCHAIN: local
        run: |
          go version | grep -F ' go1.27.0 '
          make lint
      # With its check, and whenever lint covers every package.
      - name: Cookbook go vet on the declared Go floor, staticcheck on Go 1.27.4
        if: needs.scope.outputs.lint-cookbook == 'true'
        env:
          GOTOOLCHAIN: local
        run: make lint-cookbook

  accepted:
    name: Preserve complete validation coverage
    needs: [scope, test, test-darwin, parse-postgres, cookbook-postgres, parse-sdk, minimum-go, modules, lint]
    # The receipt names the commit this run checked; the merge push reads which
    # jobs passed from GitHub. A dispatched run on a bot's pull request branch
    # checks every job in full and records too.
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !cancelled() && needs.scope.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: arc-pkg
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions/acceptance@2ee8735fdee91ff0ee16067a263da6c8a7770841 # v1.13.0
        with:
          mode: record
          results: ${{ toJSON(needs) }}
          variables: ${{ toJSON(vars) }}
