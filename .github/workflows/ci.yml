name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The repository's Actions policy runs workflows for the owner only, so a
  # pull request a bot opens (Dependabot's, or a release PR opened with
  # GITHUB_TOKEN) gets no checks. Run them on its branch with
  # `gh workflow run ci.yml --ref <branch>`; they report on the head
  # commit, so the pull request shows them.
  workflow_dispatch:
  # nightly.yml: every suite at full scope, every parse unit test under the
  # race detector, and the benchmarks.
  workflow_call:
    inputs:
      nightly:
        description: Run every parse unit test under the race detector.
        type: boolean
        default: false
    secrets:
      CI_ARTIFACT_ENDPOINT:
        required: true
      PRIVATE_REFERENCE_PATTERNS:
        required: true

permissions:
  id-token: write
  contents: read
  actions: read

# A newer run of the same PR or of main cancels the older one: it covers every
# change the older run would have. Manual acceptance runs complete.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}

jobs:
  scope:
    name: CI change scope
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-pkg
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      packages: ${{ steps.scope.outputs.packages }}
      checks: ${{ steps.scope.outputs.checks }}
      reused: ${{ steps.acceptance.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # go list maps the change to the packages it reaches; nothing is built.
      - uses: ashtonian/go-ci-actions@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
        with:
          go-version: '1.27.x'
          cache-mode: off
      - name: Verify CI scope policy
        run: python3 -B -m unittest discover -s tools -p 'test_ci_*.py'
      # The patterns name private code, so they live in a secret, not here;
      # the check prints only path:line.
      - name: Refuse private references
        env:
          PRIVATE_REFERENCE_PATTERNS: ${{ secrets.PRIVATE_REFERENCE_PATTERNS }}
        run: python3 -B tools/private_references.py
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B tools/ci_scope.py
      - name: Set up artifact receipt access
        uses: ashtonian/go-ci-actions/artifact-setup@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
      - id: acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          JOBS_REQUIRED: ${{ steps.scope.outputs.jobs }}
          PACKAGES_REQUIRED: ${{ steps.scope.outputs.packages }}
          CHECKS_REQUIRED: ${{ steps.scope.outputs.checks }}
          CI_VARIABLES_JSON: ${{ toJSON(vars) }}
        run: python3 tools/ci_acceptance.py verify

  test:
    needs: scope
    name: test (ubuntu-latest)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(needs.scope.outputs.jobs).test && needs.scope.outputs.reused != 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    env:
      # The packages the change reaches; each target tests its modules' share.
      PACKAGES: ${{ needs.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
        with:
          go-version: '1.27.x'
          cache-dependency-path: "**/go.sum"
      - name: Native process and document unit tests
        run: make test-native-unit
      - name: Native process and document integration tests
        run: make test-native-integration
      - name: Config tests
        run: make test-config
      - name: gitx tests
        run: make test-gitx
      - name: JSON value tests
        run: make test-jsonvalue
      - name: Gowalker tests
        run: make test-gowalker
      - name: HTTPx unit tests with race detection
        run: make test-httpx-unit
      - name: HTTPx integration tests with race detection
        run: make test-httpx-integration
      # Parse's SQLite integration runs in parse-postgres, beside PostgreSQL.
      # Pull requests race only the parse tests that run code concurrently;
      # the nightly run races every one.
      - name: Parse unit tests and fuzz seeds
        if: ${{ !inputs.nightly }}
        run: make test-parse-unit
      - name: Parse concurrency tests with race detection
        if: ${{ !inputs.nightly }}
        run: make test-parse-race
      - name: Parse unit tests and fuzz seeds with race detection
        if: ${{ inputs.nightly }}
        run: make test-parse-race-all
  # Only the modules with platform code: config's file watch rests on kqueue
  # there, and the native modules' processes and files on Darwin. Lint vets
  # every module on the declared Go floor.
  test-darwin:
    needs: scope
    name: test (macos-latest)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(needs.scope.outputs.jobs)['test-darwin'] && needs.scope.outputs.reused != 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PACKAGES: ${{ needs.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
        with:
          go-version: '1.27.x'
          cache-dependency-path: "**/go.sum"
      - name: Native process and document unit tests
        run: make test-native-unit
      - name: Native process and document integration tests
        run: make test-native-integration
      - name: Config tests
        run: make test-config
  parse-postgres:
    needs: scope
    name: parse integration (SQLite, PostgreSQL ${{ matrix.postgres }})
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(needs.scope.outputs.jobs)['parse-postgres'] && needs.scope.outputs.reused != 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    env:
      PACKAGES: ${{ needs.scope.outputs.packages }}
    services:
      postgres:
        image: postgis/postgis:${{ matrix.postgres }}-3.6
        env:
          POSTGRES_USER: parse
          POSTGRES_PASSWORD: parse
          POSTGRES_DB: parse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U parse -d parse"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: Parse SQLite and PostgreSQL integration with race detection
        env:
          PARSE_POSTGRES_DSN: postgres://parse:parse@localhost:5432/parse?sslmode=disable
          PARSE_POSTGIS_DSN: postgres://parse:parse@localhost:5432/parse?sslmode=disable
        run: make test-parse-integration
  parse-sdk:
    needs: scope
    name: parse TypeScript SDK and corpora (node 22.13.0 and lts/*)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(needs.scope.outputs.jobs)['parse-sdk'] && needs.scope.outputs.reused != 'true'
    runs-on: arc-pkg
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before pnpm: points pnpm at the runner's in-cluster npm cache when it answers,
      # and leaves npmjs otherwise.
      - uses: ashtonian/go-ci-actions/npm-registry@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
      # pnpm next: setup-node's pnpm cache asks pnpm for its store path. The version
      # comes from the SDK's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: parse/sdk/ts/package.json
      # package.json's engines floor, exactly: every check runs here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: parse/sdk/ts/pnpm-lock.yaml
      - name: Check the engines floor is the Node.js under test
        working-directory: parse/sdk/ts
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const floor = JSON.parse(fs.readFileSync('package.json', 'utf8')).engines.node;
          if (floor !== `>=${process.versions.node}`) {
            console.error(`::error::package.json engines.node is ${floor}; this leg runs Node.js ${process.versions.node}. Keep the two equal.`);
            process.exit(1);
          }
          JS
      - run: make test-parse-sdk
      - name: Registry availability checks
        run: make parse-sdk-registry-check
      - name: Packed SDK consumer
        run: make parse-sdk-release-check
      # The newest LTS repeats only what the runtime decides, on the same build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
      - name: Corpora and runtime tests on the newest LTS
        working-directory: parse/sdk/ts
        run: pnpm test
      - name: Packed SDK consumer on the newest LTS
        run: make parse-sdk-release-check
  parse-benchmarks:
    needs: scope
    name: parse benchmark artifacts
    # On main, only when the change reaches the benchmarked package; the
    # nightly run always records them.
    if: github.actor_id == '4212452' && github.event_name != 'pull_request' && fromJSON(needs.scope.outputs.jobs)['parse-benchmarks']
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: Record parser and cursor benchmarks
        run: >-
          go test -tags=unit -run '^$' -bench . -benchmem -count=3
          -cpuprofile=parse-cpu.prof -memprofile=parse-allocs.prof ./parse/filter | tee parse-benchmarks.txt
      - uses: ashtonian/go-ci-actions/upload-artifact@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
        with:
          name: parse-benchmarks-${{ github.sha }}
          path: |
            parse-benchmarks.txt
            parse-cpu.prof
            parse-allocs.prof
  minimum-go:
    needs: scope
    name: httpx and gitx (go 1.26)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(needs.scope.outputs.jobs)['minimum-go'] && needs.scope.outputs.reused != 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
        with:
          go-version: '1.26.x'
          cache-dependency-path: "**/go.sum"
      - name: Test HTTPx at its minimum Go version
        env:
          GOTOOLCHAIN: local
        run: |
          workspace=$(mktemp -d)
          trap 'rm -rf "$workspace"' EXIT
          (cd "$workspace" && GOWORK=off go work init \
            "$GITHUB_WORKSPACE/httpx" "$GITHUB_WORKSPACE/httpx/oauth2" \
            "$GITHUB_WORKSPACE/httpx/codec/msgpack" \
            "$GITHUB_WORKSPACE/httpx/codec/proto" "$GITHUB_WORKSPACE/httpx/compress/brotli")
          GOWORK="$workspace/go.work" make test-httpx-unit test-httpx-integration
      - name: Test gitx at its minimum Go version
        # The workspace's go line is newer than gitx's floor, so the module is tested on its own.
        env:
          GOTOOLCHAIN: local
          GOWORK: off
        working-directory: gitx
        run: |
          go version | grep -F ' go1.26.'
          go vet ./...
          go test -race -count=1 ./...
  modules:
    needs: scope
    name: module archives, examples and release tooling
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(needs.scope.outputs.jobs).modules && needs.scope.outputs.reused != 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      # The release-please runner's check needs Node.js and pnpm.
      - if: contains(needs.scope.outputs.checks, 'release-please-check')
        uses: ./.github/actions/release-please-tool
      - name: Release, cookbook and release-tool checks for the changed modules
        env:
          CHECKS: ${{ needs.scope.outputs.checks }}
          # A summary per go command: the fresh consumers' dependency compiles
          # should be remote hits (the scripts build with -trimpath).
          GOCACHEPROG_LOG_LEVEL: info
        run: |
          read -ra checks <<< "$CHECKS"
          make "${checks[@]}"
  lint:
    needs: scope
    name: lint (go 1.27.0 floor)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(needs.scope.outputs.jobs).lint && needs.scope.outputs.reused != 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: arc-pkg
    timeout-minutes: 45
    env:
      PACKAGES: ${{ needs.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
        with:
          go-version: '1.27.0'
          cache-dependency-path: "**/go.sum"
      # Vet type-checks every package and test, so on the declared floor it is
      # also the floor's build check.
      - name: go vet and staticcheck on the declared Go floor
        env:
          GOTOOLCHAIN: local
        run: |
          go version | grep -F ' go1.27.0 '
          make lint
      - name: Cookbook go vet and staticcheck on the declared Go floor
        if: contains(needs.scope.outputs.checks, 'cookbook-check')
        env:
          GOTOOLCHAIN: local
        run: make lint-cookbook

  accepted:
    name: Preserve complete validation coverage
    needs: [scope, test, test-darwin, parse-postgres, parse-sdk, minimum-go, modules, lint]
    # The record step checks each job against the scope's selection.
    if: ${{ !cancelled() && !inputs.nightly && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.scope.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: arc-pkg
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record complete validation inputs
        env:
          VALIDATION_JOBS: ${{ toJSON(needs) }}
          CI_VARIABLES_JSON: ${{ toJSON(vars) }}
        run: python3 tools/ci_acceptance.py record --output "$RUNNER_TEMP/ci-acceptance/acceptance.json"
      - uses: ashtonian/go-ci-actions/upload-artifact@439da8bdc22311fff2f04371ca9cd9c3233ee7d0 # v1.6.2
        with:
          name: acceptance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-acceptance/acceptance.json
          if-no-files-found: error
          retention-days: 1
