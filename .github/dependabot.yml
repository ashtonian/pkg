version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /gitx
      - /gowalker
      - /config
      - /config/kongprovider
      - /config/examples/cookbook
      - /httpx
      - /httpx/oauth2
      - /httpx/codec/msgpack
      - /httpx/codec/proto
      - /httpx/compress/brotli
      - /httpx/examples/gin
      - /httpx/internal/bench
      - /tools/modarchive
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      # First-party actions are the owner's own signed tags. The cooldown guards
      # against third-party releases and would only delay them.
      exclude: ["ashtonian/*"]
    commit-message:
      prefix: ci
