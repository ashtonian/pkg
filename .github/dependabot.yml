version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /config
      - /config/kongprovider
      - /config/examples/cookbook
      - /httpx
      - /httpx/codec/msgpack
      - /httpx/codec/proto
      - /httpx/compress/brotli
      - /httpx/examples/gin
      - /httpx/internal/bench
      - /tools/modarchive
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
