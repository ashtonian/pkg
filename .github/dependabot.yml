version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /config
      - /config/kongprovider
      - /config/examples/cookbook
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
